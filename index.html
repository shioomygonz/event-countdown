<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShioGonz Live Event Countdown</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <div class="container">

        <h1>ShioGonz Live Event Countdown</h1>

        <p>Create a countdown for your next live event.</p>

        <label for="eventName">Event Name:</label>
        <input
            type="text"
            id="eventName"
            placeholder="Enter event name"
        >

        <label for="eventDate">Event Date and Time:</label>
        <input
            type="datetime-local"
            id="eventDate"
        >

        <button id="startButton">
            Start Countdown
        </button>

        <h2 id="eventTitle">
            Your event countdown will appear here
        </h2>

        <div id="countdown">

            <div>
                <span id="days">0</span>
                <span class="label">Days</span>
            </div>

            <div>
                <span id="hours">0</span>
                <span class="label">Hours</span>
            </div>

            <div>
                <span id="minutes">0</span>
                <span class="label">Minutes</span>
            </div>

            <div>
                <span id="seconds">0</span>
                <span class="label">Seconds</span>
            </div>

        </div>

        <p id="message"></p>

    </div>
    <div id="eventStartedOverlay" class="event-overlay">

    <div class="concert-lights"></div>

    <div id="confettiContainer"></div>

    <div class="event-started-card">

        <div class="live-badge">
            ● LIVE
        </div>

        <div class="event-image-wrapper">
            <img
                src="event-start.jpg"
                alt="Live concert"
                class="event-start-image"
            >
        </div>

        <div class="show-content">

            <p class="show-intro">
                SHIOGONZ LIVE PRESENTS
            </p>

            <h2>
                THE EVENT<br>
                HAS STARTED!
            </h2>

            <p class="showtime">
                ✨ IT'S SHOWTIME ✨
            </p>

            <button id="closeOverlay">
                START THE SHOW 🎶
            </button>
        </div>

    </div>

</div>
    <script src="script.js"></script>

</body>
</html>
